# Tagged release: push a tag like v1.2.3 to build every product and open a
# draft GitHub release with the images, Matter OTA files, SBOMs and SHA-256 sums.
#
# Signing keys never come to GitHub. This workflow takes no signing options,
# so production images come out unsigned and are published under names that
# say so. They will not boot on a board with Secure Boot enabled. Sign them
# offline with tools/sign_release.sh, which refuses to run without a real key
# and also builds the production .ota file from the signed image.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        product: [relay-router, button-sleepy]
        profile: [dev, production]
    env:
      PRODUCT: ${{ matrix.product }}
      PROFILE: ${{ matrix.profile }}
      SBOM_WHEEL: esp_idf_sbom-1.4.0-py3-none-any.whl
      SBOM_SHA256: 3fa24ff1c14fca159ed85ff32241e50a23f392c606b314cd13f5b5b758f4d45f
      # Builds run through tools/in_container.sh, root in the container.
      IN_CONTAINER_DOCKER_ARGS: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h /
      - name: Build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tools/in_container.sh tools/build.sh "$PRODUCT" --profile "$PROFILE" --version "$version"
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          b="build/$PRODUCT-$PROFILE"
          name="$PRODUCT-$version-$PROFILE"
          if [ "$PROFILE" = production ]; then
            grep -qx 'CONFIG_SECURE_BOOT_BUILD_SIGNED_BINARIES=y' "$b/sdkconfig" && { echo "production image is signed in CI" >&2; exit 1; }
            name="$name-unsigned"
          fi
          out="dist/$name"
          mkdir -p "$out"
          cp "$b/matter_board.bin" "$out/app.bin"
          cp "$b/bootloader/bootloader.bin" "$out/bootloader.bin"
          cp "$b/partition_table/partition-table.bin" "$out/partition-table.bin"
          cp "$b/ota_data_initial.bin" "$out/ota_data_initial.bin"
          cp "$b/sdkconfig" "$out/sdkconfig"
          # An unsigned production .ota would be refused by every secured board.
          if [ "$PROFILE" = dev ]; then cp "$b/matter_board-ota.bin" "$out/app.ota"; fi
          # The SBOM tool runs in the container, against the IDF it describes.
          tools/in_container.sh bash -c '
            set -euo pipefail
            pip download --quiet --no-deps esp-idf-sbom==1.4.0 -d /tmp/sbom
            echo "$1  /tmp/sbom/$2" | sha256sum -c -
            pip install --quiet "/tmp/sbom/$2"
            esp-idf-sbom create "$3/project_description.json" -o "$4/sbom.spdx"
          ' -- "$SBOM_SHA256" "$SBOM_WHEEL" "$b" "$out"
          # Firmware embeds public PEM certificates, so check names and text files only.
          if find "$out" -name '*.pem' -o -name '*.key' | grep -q . ||
             grep -l 'PRIVATE KEY' "$out/sdkconfig"; then echo "key material in $out" >&2; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.product }}-${{ matrix.profile }}
          path: dist/
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Archive and checksum
        run: |
          cd dist
          for dir in */; do tar -czf "${dir%/}.tar.gz" "$dir"; done
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Draft release built by CI. Review before publishing.

          - `*-dev` images use Matter test credentials and are for development boards only.
          - `*-production-unsigned` images are unsigned and will not boot with Secure Boot enabled.
            Sign them offline with `tools/sign_release.sh`, which also builds the production `.ota`.
          - `SHA256SUMS` covers every archive. Each archive holds an SPDX SBOM.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
